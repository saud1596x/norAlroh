include:
  - project.yml
settings:
  base:
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOOR_FOCUS_ENABLED"
targets:
  Athar:
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NoorFocusShared/NoorFocus.entitlements
    dependencies:
      - target: NoorFocusMonitor
        embed: true
      - target: NoorFocusShield
        embed: true
      - target: NoorFocusAction
        embed: true
  NoorFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: NoorFocusExtensions/NoorFocusMonitor.swift
      - path: NoorFocusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.focus-monitor
        DEVELOPMENT_TEAM: 4SY7K26FCX
        CODE_SIGN_ENTITLEMENTS: NoorFocusShared/NoorFocus.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NoorFocusExtensions/NoorFocusMonitor-Info.plist
      properties:
        CFBundleDisplayName: نور الروح
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NoorFocusMonitor
  NoorFocusShield:
    type: app-extension
    platform: iOS
    sources:
      - path: NoorFocusExtensions/NoorFocusShield.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.focus-shield
        DEVELOPMENT_TEAM: 4SY7K26FCX
        CODE_SIGN_ENTITLEMENTS: NoorFocusShared/NoorFocus.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NoorFocusExtensions/NoorFocusShield-Info.plist
      properties:
        CFBundleDisplayName: نور الروح
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NoorFocusShield
  NoorFocusAction:
    type: app-extension
    platform: iOS
    sources:
      - path: NoorFocusExtensions/NoorFocusAction.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.focus-action
        DEVELOPMENT_TEAM: 4SY7K26FCX
        CODE_SIGN_ENTITLEMENTS: NoorFocusShared/NoorFocus.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NoorFocusExtensions/NoorFocusAction-Info.plist
      properties:
        CFBundleDisplayName: نور الروح
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NoorFocusAction
