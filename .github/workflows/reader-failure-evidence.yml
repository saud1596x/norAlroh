name: Diagnose exact failed reader and search captures
on:
  push:
    paths: [.github/workflows/reader-failure-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify failed-source identity without granting approval
        run: |
          mkdir -p work/reader-diagnosis release/reader-failure-overview
          gh api repos/saud1596x/norAlroh/actions/runs/38652635353 > work/reader-diagnosis/run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('work/reader-diagnosis/run.json').read_text())
          assert run['head_sha']=='6e37cb6069da62c9923a96811d19b3614576c750'
          assert run['conclusion']=='failure'
          PY
      - name: Extract original failed UI captures on the build host
        run: |
          gh run download 38652635353 --repo saud1596x/norAlroh --name noor-reader-screens --dir work/reader-diagnosis/artifact
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          root=Path('work/reader-diagnosis/captures')
          output=Path('release/reader-failure-overview')
          wanted=['stage1-604-single-tap-actions','former-voice-entry-now-real-inline-microphone','stage1-151-landscape-tools-hidden']
          inventory=[]
          with zipfile.ZipFile('work/reader-diagnosis/artifact/native-screens.zip') as archive:
              report=json.loads(archive.read('native-screens/capture-report.json'))
              for row in report['screenshots']:
                  name=row['title']
                  if row.get('id') in {'09-adhkar','18-hifz-result','19-hifz-history'} or any(value in name for value in wanted):
                      raw=archive.read('native-screens/'+row['file'])
                      destination=output/Path(row['file']).name
                      destination.write_bytes(raw)
                      inventory.append(dict(name=name,file=destination.name,sha256=hashlib.sha256(raw).hexdigest()))
          assert len(inventory)>=6, 'Missing requested original failed screenshots'
          (output/'provenance.json').write_text(json.dumps(dict(sourceCommit='6e37cb6069da62c9923a96811d19b3614576c750',run=38652635353,scope='Failed-source diagnostic captures only; no visual or release approval',files=inventory),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: failed-source-small-visual-diagnosis
          path: release/reader-failure-overview
          if-no-files-found: error
