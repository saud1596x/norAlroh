name: Convert and execute Quran CTC on Apple
on:
  workflow_dispatch:
  push:
    paths:
      - tools/RecitationEngineProbe/experiments/ctc_coreml.py
      - .github/workflows/ctc-coreml-candidate.yml
permissions:
  contents: read
concurrency:
  group: ctc-apple-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 transformers==4.57.1 av==16.1.0 safetensors==0.6.2 coremltools==9.0
      - name: Convert verified public weights without changing the app
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/RecitationEngineProbe/experiments/ctc_coreml.py convert
      - uses: actions/upload-artifact@v4
        with:
          name: converted-ctc-candidate
          path: release/ctc-coreml-candidate
          retention-days: 7
  apple-runtime:
    needs: convert
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: converted-ctc-candidate
          path: release/ctc-coreml-candidate
      - run: python -m pip install numpy==2.2.6 coremltools==9.0
      - name: Require actual Apple inference and lexical parity on every case
        run: python tools/RecitationEngineProbe/experiments/ctc_coreml.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-apple-runtime-measurements
          path: ctc-apple-parity.json
          if-no-files-found: warn
