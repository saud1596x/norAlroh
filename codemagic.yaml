workflows:
  independent-coreml-check:
    name: Noor independent CTC CoreML real-audio conversion parity (not release)
    instance_type: mac_mini_m2
    max_build_duration: 12
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ~/.cache/noor-independent-ctc
        - ~/Library/Caches/pip
    scripts:
      - name: Convert and compare independent CTC on original public PCM
        script: bash scripts/evaluate-independent-coreml.sh
    artifacts:
      - release/independent-coreml/**
  reader-ease-check:
    name: Noor spacious reader, playback page lock and evidence regressions
    instance_type: mac_mini_m2
    max_build_duration: 12
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - release/reader-ease-derived-data/ModuleCache.noindex
        - release/reader-ease-derived-data/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
        - release/reader-ease-derived-data/SourcePackages
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify reader layout and shared core repairs
        script: bash scripts/test-reader-ease.sh
    artifacts:
      - release/reader-ease/**
  continuous-reader-check: &continuous_reader_check
    name: Noor continuous recognition, all604 pages and complete reciter selection
    instance_type: mac_mini_m2
    max_build_duration: 14
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - release/continuous-reader-derived-data/ModuleCache.noindex
        - release/continuous-reader-derived-data/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
        - release/continuous-reader-derived-data/SourcePackages
        - ios/Athar/Fonts
        - ios/RecitationModel
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify continuous Mushaf and recognition
        script: bash scripts/test-continuous-reader.sh
    artifacts:
      - release/continuous-reader/**
  continuous-account-reader-check:
    <<: *continuous_reader_check
    name: Noor account-enabled reader, remote contracts and canonical transitions
    max_build_duration: 15
    environment:
      xcode: "26.3"
      vars:
        NOOR_PROJECT_SPEC: ios/project-accounts.yml
        NOOR_NATIVE_TEST_DEADLINE: '720'
  focused-engine-repair-check:
    <<: *continuous_reader_check
    name: Noor exact ambiguity repair and genuine session stall diagnosis
    max_build_duration: 15
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify exact engine repairs and actual stalled session
        script: python3 scripts/run-native-with-deadline.py 720 bash scripts/test-engine-repair.sh
    artifacts:
      - release/engine-repair/**
  engine-boundary-check:
    <<: *continuous_reader_check
    name: Noor source-word boundaries and genuine PCM ASR (not full release)
    max_build_duration: 12
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify source evidence and continuous bundled recognition
        script: bash scripts/test-engine-boundaries.sh
    artifacts:
      - release/engine-boundaries/**
  engine-independent-native-check:
    <<: *continuous_reader_check
    name: Noor bundled independent CTC and actual native evidence (not full release)
    max_build_duration: 15
    cache:
      cache_paths:
        - release/continuous-reader-derived-data/ModuleCache.noindex
        - release/continuous-reader-derived-data/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
        - release/continuous-reader-derived-data/SourcePackages
        - ios/Athar/Fonts
        - ios/RecitationModel
        - release/independent-coreml-model
        - ~/.cache/noor-independent-ctc
        - ~/Library/Caches/pip
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify bundled independent CTC and actual public microphone-session evidence
        script: NOOR_NATIVE_TEST_DEADLINE=720 bash scripts/test-engine-boundaries.sh
    artifacts:
      - release/engine-boundaries/**
  daily-ease-check:
    name: Noor daily ward, automatic setup and clear adhkar
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify automatic setup and separated daily adhkar
        script: bash scripts/test-daily-ease.sh
    artifacts:
      - release/daily-ease/**
  selection-regression-check:
    name: Noor adjacent ayah selection regression
    instance_type: mac_mini_m2
    max_build_duration: 8
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify adjacent ayah exclusion with original fonts
        script: bash scripts/test-selection-regression.sh
    artifacts:
      - release/selection-regression/**
  recitation-engine-check:
    name: Noor recitation backlog, real reference recognition and cancellation
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify recitation engine with recorded reference PCM
        script: bash scripts/test-recitation-engine-current.sh
    artifacts:
      - release/recitation-engine-current/**
  mushaf-usability-check:
    name: Noor Mushaf highlighting, timing bindings and startup regression
    instance_type: mac_mini_m2
    max_build_duration: 12
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Check current Mushaf changes on iPhone
        script: bash scripts/test-mushaf-usability.sh
    artifacts:
      - release/mushaf-usability/**
  archive-preservation-check:
    name: Noor recording preservation regression (not release acceptance)
    instance_type: mac_mini_m2
    max_build_duration: 8
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify recording preservation and session ownership
        script: bash scripts/test-recording-preservation.sh
    artifacts:
      - release/recording-preservation/**
  isolated-audio-check:
    name: Independent Apple audio host diagnosis (not Noor acceptance)
    instance_type: mac_mini_m2
    max_build_duration: 6
    environment:
      xcode: "26.3"
    scripts:
      - name: Install project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Test actual reference in a standalone UIKit host
        script: bash scripts/test-isolated-audio.sh
    artifacts:
      - release/isolated-audio/**
  rapid-repair-check:
    name: Noor Alruh targeted iPhone repair check (not a release gate)
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      # The 26.5 and 26.6 images both reproduced the stall on iOS 26.5.
      # Compare a different simulator runtime without weakening real-audio assertions.
      xcode: "26.3"
      vars:
        # Navigation already passed in the first actual Codemagic run.
        # This diagnostic retries audio only; complete release gates stay intact.
        NOOR_RAPID_NAVIGATION: '0'
        NOOR_RAPID_RUNTIME: 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
    cache:
      cache_paths:
        - ios/RecitationModel
        - ios/Athar/Fonts
    scripts:
      - name: Install native project generator
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Reproduce exact navigation and microphone failures first
        script: bash scripts/test-rapid-repair.sh
    artifacts:
      - release/rapid-repair/**
  recitation-app-integration:
    name: Noor Alruh offline recognition and durable audio on iOS
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: "26.5"
    scripts:
      - name: Install native project generator
        script: brew install xcodegen
      - name: Verify bundled Core ML and independent recording persistence
        script: bash scripts/test-recitation-app.sh
    artifacts:
      - release/recitation-app/**
  recitation-engine-probe:
    name: Noor Alruh native Quran recognition investigation
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      xcode: "26.5"
    scripts:
      - name: Prepare reference audio decoder
        script: brew install ffmpeg
      - name: Run pinned Quran Core ML engine and export actual word timing
        script: bash scripts/test-recitation-engine.sh
    artifacts:
      - release/recitation-engine-probe/coreml-investigation.json
      - release/recitation-engine-probe/data/data-provenance.json
      - release/recitation-engine-probe/data/fixtures/fixtures.json
  mushaf-balance:
    name: Noor Alruh all 604 pages and two iPhone reader checks
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.5"
    scripts:
      - name: Install native project generator
        script: brew install xcodegen
      - name: Check all native page layouts and actual reader behavior
        script: bash scripts/test-mushaf-balance.sh
    artifacts:
      - release/mushaf-balance/**
  ios-quality:
    name: Noor Alruh native build and quality checks
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.5"
    scripts:
      - name: Check Apple toolchain and install generator
        script: |
          python3 scripts/check-upload-toolchain.py
          brew install xcodegen
      - name: Install verified QCF V2 page fonts
        script: |
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Verify all local content
        script: |
          python3 scripts/prepare-publishing.py --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Build Release and run native tests with video
        script: |
          NOOR_RECORD_VIDEO=1 NOOR_TEST_CONFIGURATION=Release bash scripts/test-ios.sh
    artifacts:
      - release/*.xcresult
      - release/native-build-report.json
      - release/native-navigation.mp4
      - release/native-screens.zip
      - release/native-screens/capture-report.json
      - release/content-audit.json
  ios-testflight: &signed_ios
    name: Noor Alruh signed iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: noor-alruh-publisher
    environment: &signed_ios_environment
      groups:
        - noor_release
      vars:
        NOOR_RELEASE_CHANNEL: TESTFLIGHT_PREVIEW
      xcode: "26.5"
      ios_signing:
        provisioning_profiles:
          - noor-alruh-appstore-accounts
          - noor-alruh-widgets-appstore-verified
          - noor-alruh-focus-monitor-appstore
          - noor-alruh-focus-shield-appstore
          - noor-alruh-focus-action-appstore
        certificates:
          - noor-alruh-distribution
    scripts:
      - name: Verify approved publication channel and tested reader source
        script: |
          set -euo pipefail
          case "$NOOR_RELEASE_CHANNEL" in
            TESTFLIGHT_PREVIEW) python3 scripts/check-mushaf-publication.py --testflight-preview ;;
            TESTFLIGHT_USER_REVIEW) python3 scripts/check-user-testflight.py ;;
            APP_STORE) python3 scripts/check-mushaf-publication.py ;;
            *) echo "Unknown publication channel; refusing upload"; exit 1 ;;
          esac
      - name: Verify Xcode and SDK
        script: |
          python3 scripts/check-upload-toolchain.py
      - name: Install generator and licensed release fonts
        script: |
          set -euo pipefail
          brew install xcodegen
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
          python3 scripts/install-production-firebase.py
          python3 scripts/prepare-publishing.py --accounts
          cd ios && xcodegen generate --spec project-accounts.yml && cd ..
      - name: Audit local content
        script: |
          python3 scripts/prepare-publishing.py --accounts --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Create signed archive
        script: |
          #!/bin/bash
          set -euo pipefail
          noor_latest_build=$(app-store-connect get-latest-testflight-build-number 6819365625 --platform=IOS)
          if [[ ! "$noor_latest_build" =~ ^[0-9]+$ ]]; then
            echo "Cannot assign release build: App Store Connect returned no valid build number."
            exit 1
          fi
          if (( 10#$noor_latest_build < 18 )); then
            echo "Cannot assign release build: Apple has not indexed the previously delivered build18."
            exit 1
          fi
          noor_next_build=$((10#$noor_latest_build + 1))
          (cd ios && agvtool new-version -all "$noor_next_build")
          xcode-project use-profiles --project ios/Athar.xcodeproj
          xcode-project build-ipa \
            --project ios/Athar.xcodeproj \
            --scheme Athar \
            --config Release
      - name: Verify Quran resources inside signed IPA
        script: |
          python3 - <<'PY'
          import glob, hashlib, json, zipfile
          paths = glob.glob('build/ios/ipa/*.ipa')
          assert len(paths) == 1, 'Expected one signed IPA'
          expected = json.load(open('release/qcf-v2-manifest.json'))
          assert len(expected['fonts']) == 604
          with zipfile.ZipFile(paths[0]) as ipa:
              roots = {n.split('/')[1] for n in ipa.namelist() if n.startswith('Payload/') and n.split('/')[1].endswith('.app')}
              assert len(roots) == 1, 'Expected one app bundle'
              root = 'Payload/' + next(iter(roots)) + '/'
              assert json.loads(ipa.read(root + 'qcf-v2-manifest.json')) == expected, 'Missing or incorrect Quran font manifest'
              for entry in expected['fonts']:
                  data = ipa.read(root + 'p' + str(entry['page']) + '.ttf')
                  assert len(data) == entry['bytes'], 'Incorrect Quran font size'
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], 'Incorrect Quran font hash'
          print('SIGNED_IPA_QURAN_RESOURCES_VERIFIED: 604 fonts and manifest')
          PY
      - name: Verify complete account and extension payload before upload
        script: |
          python3 scripts/verify-release-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - release/release-payload-report.json
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
  ios-testflight-saud: &signed_saud_ios
    <<: *signed_ios
    name: Noor Alruh signed TestFlight / saud
    # Manual dispatch only, after matching release evidence and protected
    # noor_release configuration are present. Keep all inherited release gates.
    # The bound reserves USD1.52 at USD0.095/min including one rounding minute.
    max_build_duration: 15
    integrations:
      app_store_connect: masar-apple
    environment:
      <<: *signed_ios_environment
      ios_signing:
        provisioning_profiles:
          - noor-saud-appstore-20261015
          - noor-saud-widgets-20261015
          - noor-saud-focus-monitor-20261015
          - noor-saud-focus-shield-20261015
          - noor-saud-focus-action-20261015
        certificates:
          - masar_distribution
  ios-testflight-user-review:
    <<: *signed_saud_ios
    name: Noor Alruh user device review / TestFlight (checks unresolved)
    # User explicitly requested this unfinished build for their own iPhone
    # testing after disclosure. Do not relabel old native results as successful.
    environment:
      <<: *signed_ios_environment
      vars:
        NOOR_RELEASE_CHANNEL: TESTFLIGHT_USER_REVIEW
      ios_signing:
        provisioning_profiles:
          - noor-saud-appstore-20261015
          - noor-saud-widgets-20261015
          - noor-saud-focus-monitor-20261015
          - noor-saud-focus-shield-20261015
          - noor-saud-focus-action-20261015
        certificates:
          - masar_distribution
    publishing:
      app_store_connect:
        auth: integration
        # This flag submits to Apple's beta review, not basic internal access.
        # Existing automatic internal groups receive eligible uploaded builds;
        # Apple rejects an explicit build association to an automatic group.
        # Leave membership/distribution settings in App Store Connect unchanged.
        submit_to_testflight: false
        submit_to_app_store: false
  ios-testflight-verified-update:
    <<: *signed_ios
    name: Noor Alruh verified update / TestFlight webhook
    environment:
      <<: *signed_ios_environment
      xcode: "26.5"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mushaf-recitation-correction-20261008
          include: true
          source: true
      cancel_previous_builds: false
    when:
      condition: event.head_commit.message == "Publish verified Noor update to TestFlight"
      changeset:
        includes:
          - release/current-native-preview-evidence.json
          - release/testflight-preview-review.json
          - codemagic.yaml
  ios-appstore:
    <<: *signed_ios
    name: Noor Alruh signed iOS / App Store release
    environment:
      <<: *signed_ios_environment
      vars:
        NOOR_RELEASE_CHANNEL: APP_STORE
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: false
        release_type: AFTER_APPROVAL
  ios-ipad-quality:
    name: Noor Alruh iPad Release checks and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.5"
    scripts:
      - name: Check Apple toolchain and install generator
        script: |
          python3 scripts/check-upload-toolchain.py
          brew install xcodegen
      - name: Install verified QCF V2 page fonts
        script: |
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Verify all local content
        script: |
          python3 scripts/prepare-publishing.py --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Build Release and run native tests with video
        script: |
          NOOR_SIMULATOR_FAMILY=iPad NOOR_RECORD_VIDEO=1 NOOR_TEST_CONFIGURATION=Release bash scripts/test-ios.sh
    artifacts:
      - release/*.xcresult
      - release/native-build-report.json
      - release/native-navigation.mp4
      - release/native-screens.zip
      - release/native-screens/capture-report.json
      - release/content-audit.json
  ios-simulator-preview-verified:
    name: Noor Alruh verified native Simulator preview
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mushaf-recitation-correction-20261008
          include: true
          source: true
      cancel_previous_builds: false
    when:
      condition: event.head_commit.message == "Build verified Noor Simulator preview"
      changeset:
        includes:
          - codemagic.yaml
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: "26.5"
      vars:
        NOOR_PREVIEW_SOURCE: e4af7f70c51d26208d74ff9e8182fadf06bfe6e0
        NOOR_PREVIEW_NATIVE_RUN: '38078097459'
    scripts:
      - name: Verify complete native success and pin actual application source
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/saud1596x/norAlroh/actions/runs/' + os.environ['NOOR_PREVIEW_NATIVE_RUN']
          request = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json', 'User-Agent':'noor-verified-preview'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Pinned complete native test run has not passed'
          assert run['head_sha'] == os.environ['NOOR_PREVIEW_SOURCE'], 'Native source mismatch'
          PY
          git fetch origin "$NOOR_PREVIEW_SOURCE"
          git checkout --detach "$NOOR_PREVIEW_SOURCE"
          test "$(git rev-parse HEAD)" = "$NOOR_PREVIEW_SOURCE"
      - name: Generate native app and verified bundled Quran resources
        script: |
          set -euo pipefail
          brew install xcodegen
          # The existing preGenCommand prepares the pinned model/font resources.
          # No production Firebase keys, signing groups or acceptance hooks.
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build real Release application for iOS Simulator
        script: |
          set -euo pipefail
          xcodebuild build \
            -project ios/Athar.xcodeproj -scheme Athar \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/noor-preview-derived-data \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          app = pathlib.Path('build/noor-preview-derived-data/Build/Products/Release-iphonesimulator/Athar.app')
          assert app.is_dir(), 'Native Simulator app missing'
          with (app/'Info.plist').open('rb') as stream:
              info = plistlib.load(stream)
          assert info['CFBundleIdentifier'] == 'com.saud1596x.nooralruh'
          assert 'iPhoneSimulator' in info['CFBundleSupportedPlatforms']
          executable = app/info['CFBundleExecutable']
          report = {'sourceCommit':os.environ['NOOR_PREVIEW_SOURCE'],
                    'nativeRun':int(os.environ['NOOR_PREVIEW_NATIVE_RUN']),
                    'applicationBundle':str(app),
                    'executableSha256':hashlib.sha256(executable.read_bytes()).hexdigest(),
                    'buildConfiguration':'Release', 'acceptanceHooksEnabled':False,
                    'accountBackendIncluded':False, 'signedDeviceBuild':False,
                    'physicalDeviceAcceptance':False,
                    'scope':'Actual native guest app in Simulator; not production account or microphone-device acceptance'}
          pathlib.Path('build/noor-preview-provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
    artifacts:
      # Official App Preview integration detects the .app artifact directly.
      - build/noor-preview-derived-data/Build/Products/Release-iphonesimulator/Athar.app
      - build/noor-preview-provenance.json

