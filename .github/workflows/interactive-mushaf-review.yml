name: Interactive Mushaf native review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interactive-mushaf-review
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install native project generator
        run: brew install xcodegen
      - name: Verify all 604 pages and both actual iPhone readers
        run: bash scripts/test-mushaf-balance.sh
      - name: Keep actual native images, video and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-balance-two-iPhones
          path: release/mushaf-balance
          retention-days: 14
          if-no-files-found: error
