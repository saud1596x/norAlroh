name: Live Mushaf recitation regressions
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-recitation-regressions.yml
      - scripts/test-live-recitation.sh
      - scripts/prepare-independent-ctc.py
      - scripts/coreml_build_runtime.py
      - scripts/coreml-build-constraints.txt
      - tools/reciter_alignment/export_coreml.py
      - ios/Athar/InteractiveMushafReader.swift
      - ios/Athar/QuranMicrophoneCapture.swift
      - ios/Athar/QuranLiveRecitationStorage.swift
      - ios/Athar/QuranRecitationController.swift
      - ios/Athar/MushafStudySession.swift
      - ios/Athar/QuranRecognitionWorker.swift
      - ios/AtharTests/QuranLiveRecitationStorageTests.swift
      - ios/AtharTests/QuranLiveStoragePolicyTests.swift
      - ios/AtharTests/QuranListeningLocationTests.swift
      - ios/AtharTests/QuranPracticeVisibilityTests.swift
      - ios/AtharTests/NoorReaderCoreRegressionTests.swift
      - tools/RecitationEngineProbe/Sources/RecitationSessions/QuranListeningLocation.swift
permissions:
  contents: read
concurrency:
  group: live-recitation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-reader:
    # Standard hosted runner, public repository; no paid/larger runner or keys.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned CoreML conversion toolchain predates Python3.14.
          # Keep its exact tested torch/model pins; do not upgrade the graph.
          python-version: '3.11'
      - name: Select installed Xcode
        run: python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Install project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify live-only storage and actual one-tap capture separately
        run: bash scripts/test-live-recitation.sh
      - name: Preserve bounded original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-recitation-${{ github.sha }}
          path: |
            release/live-recitation/*.json
            release/live-recitation/*.txt
            release/live-recitation/*.ips
            release/live-recitation/*-screenshots/*.png
            release/live-recitation/*-screenshots/*.json
          retention-days: 1
          compression-level: 9
