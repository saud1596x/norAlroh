name: Recitation server contracts and security
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned server dependencies
        run: python -m pip install -r server/recitation/requirements.txt pytest==9.1.1
      - name: API, cryptographic identity, isolation, lifecycle and fault tests
        env:
          PYTHONPATH: server/recitation
        run: python -m pytest server/recitation/tests -q --junitxml=backend-tests.xml
      - name: Verify shipped recording identities and exact offline import
        run: python -m unittest discover -s scripts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-contract-results
          path: backend-tests.xml
