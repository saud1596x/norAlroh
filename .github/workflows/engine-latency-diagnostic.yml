name: Actual learner engine latency diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/engine-latency-diagnostic.yml
      - scripts/test-engine-latency.sh
      - scripts/typecheck-recitation-core.py
      - ios/Athar/QuranIndependentCTC.swift
      - ios/Athar/QuranRecognitionWorker.swift
      - ios/AtharTests/QuranIndependentAgreementTests.swift
permissions:
  contents: read
concurrency:
  group: engine-latency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-model:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact prior compiler regression control
        # Checkout is shallow. Read this one original source object, rather
        # than silently omitting the negative control or fetching all history.
        run: git fetch --no-tags --depth=1 origin 9cca6585b775a78bb8d5bdf18d8d1826897c91f4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select installed Xcode
        run: python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Install project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Measure actual model preparation and paired inference
        run: bash scripts/test-engine-latency.sh
      - name: Preserve original source, logs and public-fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-latency-${{ github.sha }}
          path: |
            release/engine-latency/*.json
            release/engine-latency/*.txt
            release/engine-latency/screenshots/*.json
            release/recitation-core-preflight/*
          if-no-files-found: error
          retention-days: 2
