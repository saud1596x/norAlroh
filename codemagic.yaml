workflows:
  ios-quality:
    name: Noor Alruh native build and quality checks
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
    scripts:
      - name: Check Apple toolchain and install generator
        script: |
          python3 scripts/check-upload-toolchain.py
          brew install xcodegen
      - name: Install verified QCF V2 page fonts
        script: |
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Verify all local content
        script: |
          python3 scripts/prepare-publishing.py --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Build Release and run native tests with video
        script: |
          NOOR_RECORD_VIDEO=1 NOOR_TEST_CONFIGURATION=Release bash scripts/test-ios.sh
    artifacts:
      - release/*.xcresult
      - release/native-build-report.json
      - release/native-navigation.mp4
      - release/native-screens.zip
      - release/native-screens/capture-report.json
      - release/content-audit.json
  ios-testflight:
    name: Noor Alruh signed iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: noor-alruh-publisher
    environment:
      groups:
        - noor_release
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - noor-alruh-appstore
        certificates:
          - noor-alruh-distribution
    scripts:
      - name: Verify Xcode and SDK
        script: |
          python3 scripts/check-upload-toolchain.py
      - name: Install generator and licensed release fonts
        script: |
          brew install xcodegen
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
          cd ios && xcodegen generate && cd ..
      - name: Audit local content
        script: |
          python3 scripts/prepare-publishing.py --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Create signed archive
        script: |
          xcode-project use-profiles --project ios/Athar.xcodeproj
          xcode-project build-ipa \
            --project ios/Athar.xcodeproj \
            --scheme Athar \
            --config Release \
            --archive-flags="CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 1))"
      - name: Verify Quran resources inside signed IPA
        script: |
          python3 - <<'PY'
          import glob, hashlib, json, zipfile
          paths = glob.glob('build/ios/ipa/*.ipa')
          assert len(paths) == 1, 'Expected one signed IPA'
          expected = json.load(open('release/qcf-v2-manifest.json'))
          assert len(expected['fonts']) == 604
          with zipfile.ZipFile(paths[0]) as ipa:
              roots = {n.split('/')[1] for n in ipa.namelist() if n.startswith('Payload/') and n.split('/')[1].endswith('.app')}
              assert len(roots) == 1, 'Expected one app bundle'
              root = 'Payload/' + next(iter(roots)) + '/'
              assert json.loads(ipa.read(root + 'qcf-v2-manifest.json')) == expected, 'Missing or incorrect Quran font manifest'
              for entry in expected['fonts']:
                  data = ipa.read(root + 'p' + str(entry['page']) + '.ttf')
                  assert len(data) == entry['bytes'], 'Incorrect Quran font size'
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], 'Incorrect Quran font hash'
          print('SIGNED_IPA_QURAN_RESOURCES_VERIFIED: 604 fonts and manifest')
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
  ios-ipad-quality:
    name: Noor Alruh iPad Release checks and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
    scripts:
      - name: Check Apple toolchain and install generator
        script: |
          python3 scripts/check-upload-toolchain.py
          brew install xcodegen
      - name: Install verified QCF V2 page fonts
        script: |
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Verify all local content
        script: |
          python3 scripts/prepare-publishing.py --check
          python3 scripts/check-source.py --swiftc "$(xcrun --find swiftc)"
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Build Release and run native tests with video
        script: |
          NOOR_SIMULATOR_FAMILY=iPad NOOR_RECORD_VIDEO=1 NOOR_TEST_CONFIGURATION=Release bash scripts/test-ios.sh
    artifacts:
      - release/*.xcresult
      - release/native-build-report.json
      - release/native-navigation.mp4
      - release/native-screens.zip
      - release/native-screens/capture-report.json
      - release/content-audit.json
