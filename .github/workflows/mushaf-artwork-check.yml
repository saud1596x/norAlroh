name: Fixed Mushaf artwork checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mushaf-artwork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Choose Xcode
        run: python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Generate native project
        run: |
          python3 scripts/prepare-king-fahd-mushaf.py
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Test production artwork geometry and activation gate
        run: |
          NOOR_ARTWORK_SIMULATOR="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,a in d["devices"].items() if "SimRuntime.iOS" in r for x in a if x.get("isAvailable") and x["name"].startswith("iPhone") and "Pro Max" in x["name"]))')"
          xcodebuild test -project ios/Athar.xcodeproj -scheme Athar -configuration Release -destination "platform=iOS Simulator,id=$NOOR_ARTWORK_SIMULATOR" -only-testing:AtharTests/MushafArtworkTests -parallel-testing-enabled NO -resultBundlePath release/mushaf-artwork-geometry.xcresult CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
      - name: Export actual native original page captures
        if: always()
        run: xcrun xcresulttool export attachments --path release/mushaf-artwork-geometry.xcresult --output-path release/king-fahd-native-captures
      - name: Save native original and geometry evidence (review pending)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-artwork-geometry-NOT-visual-approval
          path: |
            release/mushaf-artwork-geometry.xcresult
            release/king-fahd-native-captures
          retention-days: 14
