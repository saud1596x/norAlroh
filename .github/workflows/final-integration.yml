name: Noor combined Release acceptance
on:
  workflow_dispatch:
  push:
    branches: [noor-final-integration-20261008]
    paths: ['release/final-integration-ready.json']
permissions:
  contents: read
concurrency:
  group: noor-final-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading:
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        display: [compact, large]
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete integration batch
        run: |
          python3 - <<'PYBATCH'
          import hashlib,json
          from pathlib import Path
          marker=json.loads(Path('release/final-integration-ready.json').read_text())
          for name,expected in marker['sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected, 'Integration mismatch: '+name
          print('Complete integration source verified')
          PYBATCH
      - name: Choose Xcode
        run: python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Restore pinned Quran fonts
        uses: actions/cache@v4
        with:
          path: ios/Athar/Fonts
          key: qcf-v2-reviewed-${{ hashFiles('release/qcf-v2-manifest.json', 'scripts/prepare-qcf-v2.py', 'scripts/prepare-mushaf-companion.py') }}
      # Preparation still validates each restored font against its pinned hash.
      - name: Prepare original Quran resources
        run: |
          brew install xcodegen
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
          xcodegen generate --spec ios/project.yml --project ios
      - name: Select actual iPhone simulator
        env:
          DISPLAY_CLASS: ${{ matrix.display }}
        run: |
          xcrun simctl list devices available --json > /tmp/noor-stage1-devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,os
          devices=[d for r,rows in json.load(open('/tmp/noor-stage1-devices.json'))['devices'].items() if 'SimRuntime.iOS' in r for d in rows if d.get('isAvailable') and d['name'].startswith('iPhone')]
          large=os.environ['DISPLAY_CLASS']=='large'
          candidates=[d for d in devices if ('Pro Max' in d['name'])==large]
          assert candidates, 'Requested iPhone display is unavailable'
          selected=candidates[0]
          print('NOOR_STAGE1_DEVICE='+selected['udid'])
          print('NOOR_STAGE1_DEVICE_NAME='+selected['name'])
          PY
      - name: Boot selected iPhone with bounded readiness check
        timeout-minutes: 5
        run: |
          python3 - <<'PYBOOT'
          import os, subprocess
          # The same native boot command used by scripts/test-ios.sh, with a
          # deadline so an unresponsive simulator cannot consume the test job.
          subprocess.run(['xcrun', 'simctl', 'bootstatus', os.environ['NOOR_STAGE1_DEVICE'], '-b'], check=True, timeout=240)
          PYBOOT
      - name: Native geometry and actual reader acceptance
        run: |
          echo "Actual simulator: $NOOR_STAGE1_DEVICE_NAME"
          xcodebuild test -project ios/Athar.xcodeproj -scheme Athar -configuration Release \
            -destination "platform=iOS Simulator,id=$NOOR_STAGE1_DEVICE" -destination-timeout 60 \
            -only-testing:AtharTests/MushafViewportTests \
            -only-testing:AtharUITests/NoorReaderComfortUITests \
            -only-testing:AtharTests/KhatmahJourneyTests \
            -only-testing:AtharTests/NoorJourneyIndexTests \
            -only-testing:AtharTests/AutomaticPrayerTests \
            -only-testing:AtharTests/NoorRetiredFridayCleanupTests \
            -only-testing:AtharTests/FridayTests \
            -only-testing:AtharTests/NoorRemovedFeatureRetentionTests \
            -only-testing:AtharTests/WidgetTests \
            -only-testing:AtharTests/QuranAccuracyTests \
            -only-testing:AtharTests/MushafStudySessionTests \
            -only-testing:AtharTests/MushafRecordingTests \
            -only-testing:AtharTests/MushafRepetitionTests \
            -only-testing:AtharTests/MushafMemorizationTests \
            -only-testing:AtharTests/ReadingSyncTests \
            -only-testing:AtharTests/LocalDataRecoveryTests \
            -only-testing:AtharTests/PublishingContentTests \
            -only-testing:AtharUITests/NoorKhatmahUITests \
            -only-testing:AtharUITests/NoorPrayerDisplayUITests \
            -only-testing:AtharUITests/NoorFridayRetirementUITests \
            -only-testing:AtharUITests/NoorInteractiveMushafUITests \
            -only-testing:AtharUITests/NoorMushafStudyUITests/testInlinePageSessionRevealPauseResumeAndPartialFinishSurviveRelaunch \
            -only-testing:AtharUITests/NoorMushafStudyUITests/testFormerVoiceEntryOpensActualInlineMushafWithoutModelOrAccount \
            -only-testing:AtharUITests/NoorMushafStudyUITests/testActualRepeatControlsPersistAndGapCancels \
            -parallel-testing-enabled NO -resultBundlePath release/stage1-${{ matrix.display }}.xcresult \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES SWIFT_COMPILATION_MODE=incremental
      - name: Actual microphone background resume and playback in Release
        run: |
          xcrun simctl privacy "$NOOR_STAGE1_DEVICE" grant microphone com.saud1596x.nooralruh
          xcodebuild test -project ios/Athar.xcodeproj -scheme Athar -configuration Release \
            -destination "platform=iOS Simulator,id=$NOOR_STAGE1_DEVICE" -destination-timeout 60 \
            -only-testing:AtharUITests/NoorMushafStudyUITests/testMicCaptureBackgroundResumeAndPlaybackAreRealAndDurable \
            -parallel-testing-enabled NO -resultBundlePath release/recording-${{ matrix.display }}.xcresult \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES SWIFT_COMPILATION_MODE=incremental
      - name: Export actual application screenshots
        if: always()
        run: |
          if [ -d release/stage1-${{ matrix.display }}.xcresult ]; then
            xcrun xcresulttool export attachments --path release/stage1-${{ matrix.display }}.xcresult \
              --output-path release/stage1-${{ matrix.display }}-screens
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mushaf-stage1-${{ matrix.display }}
          path: |
            release/stage1-${{ matrix.display }}.xcresult
            release/stage1-${{ matrix.display }}-screens
          retention-days: 14
      - name: Export small actual screenshot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-stage1-screens-${{ matrix.display }}
          path: release/stage1-${{ matrix.display }}-screens
          retention-days: 14
