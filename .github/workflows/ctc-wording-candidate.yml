name: Pinned compact CTC Quran wording comparison
on:
  workflow_dispatch:
  push:
    paths:
      - tools/RecitationEngineProbe/experiments/benchmark_ctc_wording.py
      - .github/workflows/ctc-wording-candidate.yml
permissions:
  contents: read
concurrency:
  group: ctc-wording-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-audio-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CPU inference runtime
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned public audio and tokenizer dependencies
        run: python -m pip install numpy==2.2.6 transformers==4.57.1 av==16.1.0 safetensors==0.6.2
      - name: Execute independent CTC decoding without reference prompts
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/RecitationEngineProbe/experiments/benchmark_ctc_wording.py --small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-wording-comparison
          path: ctc-wording-candidate.json
          if-no-files-found: warn
