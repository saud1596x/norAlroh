name: Screen actual public FastConformer source
on:
  workflow_dispatch:
  push:
    paths:
      - tools/streaming_recitation_probe/**
      - .github/workflows/fastconformer-source-probe.yml
permissions:
  contents: read
concurrency:
  group: fastconformer-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-ctc:
    # Standard public runner; no cloud GPU, paid runner, key or service.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check evidence failure regressions before installing models
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/streaming_recitation_probe/tests -v
      - name: Install official CPU runtime
        run: |
          set -euo pipefail
          mkdir -p release/fastconformer-source-probe
          timeout 600s python -m pip install torch==2.7.0 torchaudio==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee release/fastconformer-source-probe/cpu-install.txt
      - name: Install verified official PyAV Linux wheel
        run: |
          set -euo pipefail
          timeout 180s python -m pip install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r tools/streaming_recitation_probe/requirements-audio-linux.txt 2>&1 | tee release/fastconformer-source-probe/audio-install.txt
      - name: Install pinned NeMo speech framework
        run: |
          set -euo pipefail
          timeout 900s python -m pip install --index-url https://pypi.org/simple --only-binary=numpy,pyarrow,pandas,scipy,scikit-learn,matplotlib -r tools/streaming_recitation_probe/requirements-runtime-linux.txt 2>&1 | tee release/fastconformer-source-probe/install.txt
          python -m pip freeze > release/fastconformer-source-probe/runtime.txt
      - name: Verify actual CPU runtime imports and NumPy ABI before model work
        run: |
          set -euo pipefail
          timeout 120s python -m pip check 2>&1 | tee release/fastconformer-source-probe/dependency-check.txt
          timeout 180s python tools/streaming_recitation_probe/verify_runtime.py --output release/fastconformer-source-probe/runtime-check.json 2>&1 | tee release/fastconformer-source-probe/runtime-imports.txt
      - name: Decode original public clips with original FP32 CTC head
        run: |
          set -euo pipefail
          python tools/streaming_recitation_probe/run_probe.py --output-dir release/fastconformer-source-probe --expected-commit "$GITHUB_SHA" -- timeout 480s python -u tools/streaming_recitation_probe/verify_source.py
      - name: Preserve installed dependency inventory even after failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p release/fastconformer-source-probe
          python -m pip freeze > release/fastconformer-source-probe/runtime.txt
      - name: Preserve actual source result without model or private audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastconformer-source-${{ github.sha }}
          path: |
            release/fastconformer-source-probe/*.json
            release/fastconformer-source-probe/*.txt
          retention-days: 1
          if-no-files-found: warn
