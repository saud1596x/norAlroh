name: Athar
options:
  bundleIdPrefix: com.saud1596x.nooralruh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    exactVersion: 1.5.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    VERSIONING_SYSTEM: apple-generic
targets:
  Athar:
    type: application
    platform: iOS
    sources:
      - path: Athar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh
        DEVELOPMENT_TEAM: 4SY7K26FCX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Athar/Info.plist
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: Adhan
        product: Adhan
  AtharTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtharTests
    dependencies:
      - target: Athar
  AtharUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AtharUITests
    dependencies:
      - target: Athar
schemes:
  Athar:
    build:
      targets:
        Athar: all
        AtharTests: [test]
        AtharUITests: [test]
    test:
      targets: [AtharTests, AtharUITests]
    archive:
      config: Release
