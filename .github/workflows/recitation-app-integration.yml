name: Offline Quran recitation app integration
on:
  workflow_dispatch:
  push:
    paths:
      - ios/Athar/**
      - ios/AtharTests/**
      - tools/RecitationEngineProbe/Sources/RecitationCapture/**
      - tools/RecitationEngineProbe/Sources/RecitationSessions/**
      - release/legal-content*.json
      - .github/workflows/recitation-app-integration.yml
      - ios/Athar/InteractiveMushafReader.swift
      - ios/Athar/MushafSessionRecorder.swift
      - ios/Athar/MushafStudyViews.swift
      - ios/AtharTests/MushafRecordingTests.swift
      - ios/Athar/QCFV2Content.swift
      - ios/Athar/QuranSessionResult.swift
      - ios/Athar/QuranRecitationScope.swift
      - ios/Athar/InteractiveMushafCanvas.swift
      - ios/AtharUITests/NoorInteractiveMushafUITests.swift
      - tools/RecitationEngineProbe/Sources/RecitationAlignment/**
      - content-sources/recitation-word-script.json
      - content-sources/recitation-model-manifest.json
      - ios/project.yml
      - scripts/prepare-recitation-model.py
      - scripts/prepare-native-quran-resources.sh
      - ios/Athar/QuranMicrophoneCapture.swift
      - ios/Athar/QuranRecognitionWorker.swift
      - ios/Athar/NoorAccountView.swift
      - ios/Athar/NoorOperationDeadline.swift
      - ios/Athar/QuranRecitationController.swift
      - ios/AtharTests/QuranRecognitionIntegrationTests.swift
      - ios/AtharTests/NoorOperationDeadlineTests.swift
      - ios/AtharUITests/NoorAllScreensTests.swift
      - scripts/test-home-flow.sh
      - scripts/test-recitation-app.sh
      - scripts/seed-recording-ui.py
      - scripts/verify-recording-ui-removal.py
      - scripts/recording_ui_evidence.py
      - scripts/tests/test_recording_ui_evidence.py
      - ios/AtharTests/QuranRecognitionWorkerLifecycleTests.swift
      - ios/AtharTests/NoorAccountDeletionStateTests.swift
      - ios/AtharTests/PrayerLocationLifecycleTests.swift
      - ios/AtharTests/NotificationReconciliationTests.swift
      - ios/AtharTests/NoorPersonalReminderTests.swift
permissions:
  contents: read
concurrency:
  group: recitation-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        display: [compact, large]
    env:
      NOOR_TEST_CONFIGURATION: Release
      NOOR_DISPLAY_CLASS: ${{ matrix.display }}
      NOOR_ALL_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned resources that are revalidated before every build
        uses: actions/cache@v4
        with:
          path: |
            ios/RecitationModel
            ios/Athar/Fonts
          key: noor-quran-resources-${{ hashFiles('content-sources/recitation-model-manifest.json', 'release/qcf-v2-manifest.json', 'scripts/prepare-qcf-v2.py', 'scripts/prepare-mushaf-companion.py') }}
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify actual bundled model and independent audio persistence
        run: bash scripts/test-home-flow.sh
      - name: Retain actual iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recitation-app-integration-${{ matrix.display }}
          path: release/home-flow
