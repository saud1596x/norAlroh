name: Home account and inline review acceptance
on:
  push:
    paths: ['.github/workflows/home-flow.yml']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact fully verified source commit to test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: home-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  progress:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        display: [compact, large]
    env:
      NOOR_DISPLAY_CLASS: ${{ matrix.display }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact authorized source commit
        env:
          NOOR_EXPECTED_SOURCE: ${{ inputs.source_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          expected=os.environ['NOOR_EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}',expected), 'Require exact source SHA'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==expected, 'Wrong source commit: '+actual
          assert not subprocess.check_output(['git','status','--porcelain'],text=True), 'Modified source tree'
          print('Testing exact complete source commit '+actual+'; no signing, hardware or publication claim.')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ios/RecitationModel
            ios/Athar/Fonts
          key: noor-quran-resources-${{ hashFiles('content-sources/recitation-model-manifest.json', 'release/qcf-v2-manifest.json', 'scripts/prepare-qcf-v2.py', 'scripts/prepare-mushaf-companion.py') }}
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify four tabs and reader flows with portable reference fixture output
        run: bash scripts/test-home-flow.sh
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-flow-${{ matrix.display }}
          path: release/home-flow
