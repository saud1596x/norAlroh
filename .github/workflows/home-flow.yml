name: Home and reading-only Release acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact complete source commit to test without signing or publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: home-flow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/reading-only-native.yml
    with:
      source_sha: ${{ inputs.source_sha }}
