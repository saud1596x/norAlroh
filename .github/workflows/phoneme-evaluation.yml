name: Pinned phonetic backend deployment probe
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/benchmark-phoneme-backend.py
      - .github/workflows/phoneme-evaluation.yml
permissions:
  contents: read
jobs:
  public-audio-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference runtime
        run: python -m pip install numpy==2.2.6 onnxruntime==1.22.1 transformers==4.57.1 av==14.4.0
      - name: Execute real phonetic inference on pinned public recordings
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/benchmark-phoneme-backend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phonetic-deployment-measurements
          path: phoneme-probe-result.json
          if-no-files-found: warn
