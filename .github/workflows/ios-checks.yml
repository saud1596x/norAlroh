name: Native iOS checks
on:
  workflow_dispatch:
  push:
    # This review branch runs selective complete-source gates in Codemagic.
    # Retain manual and PR Release acceptance without partial-upload rebuilds.
    branches-ignore: [mushaf-recitation-correction-20261008]
    paths: ['ios/**', 'scripts/**', 'content-sources/**', 'release/config.json', 'release/legal-content.json', 'support-site/**', '.github/workflows/ios-checks.yml']
  pull_request:
    paths: ['ios/**', 'scripts/**', 'content-sources/**', 'release/config.json', 'release/legal-content.json', 'support-site/**', '.github/workflows/ios-checks.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Choose installed Xcode 26 or newer
        run: |
          python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Install project generator
        run: brew install xcodegen
      - name: Install verified QCF V2 page fonts
        run: |
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Verify bundled content
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/prepare-publishing.py --check
          python3 scripts/audit-content.py
          python3 scripts/verify-quran-text.py
      - name: Compile and run iOS unit and navigation tests
        env:
          NOOR_RECORD_VIDEO: '1'
          NOOR_TEST_CONFIGURATION: Release
        run: bash scripts/test-ios.sh
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-native-evidence
          path: |
            release/native-unit.xcresult
            release/native-ui.xcresult
            release/native-build-report.json
            release/native-navigation.mp4
            release/native-screens.zip
            release/native-screens/capture-report.json
            release/content-audit.json
          retention-days: 14
      - name: Save actual reader screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-reader-screens
          path: |
            release/native-screens.zip
            release/native-screens/capture-report.json
            release/native-build-report.json
          retention-days: 14
  focus-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Choose installed Xcode
        run: python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Prepare verified Quran resources
        run: |
          brew install xcodegen
          python3 scripts/prepare-mushaf-companion.py
          python3 scripts/prepare-qcf-v2.py --output ios/Athar/Fonts
          cp release/qcf-v2-manifest.json ios/Athar/qcf-v2-manifest.json
      - name: Build accounts, Friday alarms and Screen Time extensions
        run: |
          xcodegen generate --spec ios/project-accounts.yml --project ios
          xcodebuild build -project ios/Athar.xcodeproj -scheme Athar -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
