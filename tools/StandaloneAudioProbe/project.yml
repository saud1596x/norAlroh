name: StandaloneAudioProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AudioProbe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.diagnostic.audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AudioProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../ios/AtharTests/RecitationFixtures/112001.mp3
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.diagnostic.audio.tests
    dependencies:
      - target: AudioProbe
schemes:
  AudioProbe:
    build:
      targets:
        AudioProbe: all
        AudioProbeTests: [test]
    test:
      targets: [AudioProbeTests]
