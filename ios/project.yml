name: Athar
options:
  preGenCommand: python3 ../scripts/prepare-recitation-model.py
  bundleIdPrefix: com.saud1596x.nooralruh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    revision: 1e2a163736dfa5a198e637ae44c114e1c6d5cc2d
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    exactVersion: 1.5.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    VERSIONING_SYSTEM: apple-generic
targets:
  Athar:
    type: application
    platform: iOS
    sources:
      - path: Athar
      - path: NoorFocusShared
      - path: NoorWidgetShared
      - path: ../tools/RecitationEngineProbe/Sources/RecitationAlignment
      - path: ../tools/RecitationEngineProbe/Sources/RecitationCapture
      - path: ../tools/RecitationEngineProbe/Sources/RecitationSessions
      - path: ../tools/RecitationEngineProbe/Sources/RecitationEngineProbe/AudioEvidenceGate.swift
      - path: ../content-sources/recitation-word-script.json
        buildPhase: resources
      - path: RecitationModel
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh
        DEVELOPMENT_TEAM: 4SY7K26FCX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Athar/Info.plist
        CODE_SIGN_ENTITLEMENTS: NoorWidgetShared/NoorWidgets.entitlements
    dependencies:
      - target: NoorWidgets
        embed: true
      - package: Adhan
        product: Adhan
      - package: WhisperKit
        product: WhisperKit
  NoorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NoorWidgets
      - path: NoorWidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud1596x.nooralruh.widgets
        DEVELOPMENT_TEAM: 4SY7K26FCX
        CODE_SIGN_ENTITLEMENTS: NoorWidgetShared/NoorWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: Adhan
        product: Adhan
    info:
      path: NoorWidgets/Info.plist
      properties:
        CFBundleDisplayName: نور الروح
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AtharTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtharTests
    dependencies:
      - target: Athar
  AtharUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AtharUITests
    dependencies:
      - target: Athar
schemes:
  Athar:
    build:
      targets:
        Athar: all
        AtharTests: [test]
        AtharUITests: [test]
    test:
      targets: [AtharTests, AtharUITests]
    archive:
      config: Release
